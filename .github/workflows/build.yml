name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nds-rom:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: make
        run: make

      - name: upload rom
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-for-ds.nds
          path: '*.nds'
          if-no-files-found: error
